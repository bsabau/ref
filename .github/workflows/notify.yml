name: Push notification cron

on:
  schedule:
    # Every 5 min while sets can start: first set 14:30 EEST (11:30 UTC),
    # last set 01:45 EEST next day (22:45 UTC same UTC day). 26 Jul is a
    # buffer day for live testing. ~1000 GitHub-billed minutes total,
    # within the 2000/month free tier for private repos.
    - cron: "*/5 10-23 26-31 7 *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification check
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notify"
